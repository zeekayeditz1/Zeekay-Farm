name: Deploy Zeekay Farm to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint repository
        run: npm run lint

      - name: Start isolated local portal
        run: |
          printf 'AUTH_PEPPER=local-edit-delete-test-only\n' > .dev.vars
          npm run dev > /tmp/ali-dairies-dev.log 2>&1 &
          echo $! > /tmp/ali-dairies-dev.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/auth >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ali-dairies-dev.log
          exit 1

      - name: Run integration checks
        run: node tests/records.integration.mjs

      - name: Stop isolated local portal
        if: always()
        run: |
          if [ -f /tmp/ali-dairies-dev.pid ]; then
            kill "$(cat /tmp/ali-dairies-dev.pid)" || true
          fi

      - name: Build Cloudflare Worker
        run: npm run build

      - name: Deploy existing Cloudflare Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
